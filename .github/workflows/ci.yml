name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read Xcode version
        id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/Packages/ChairKit/.build
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Packages/*/Package.swift', 'ios/Packages/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Install SwiftLint and SwiftFormat
        env:
          SWIFTLINT_VERSION: 0.57.0
          SWIFTFORMAT_VERSION: 0.61.1
        run: |
          mkdir -p "$RUNNER_TEMP/lint-tools"
          cd "$RUNNER_TEMP/lint-tools"
          curl -fsSL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          curl -fsSL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          unzip -oq swiftlint.zip
          unzip -oq swiftformat.zip
          chmod +x swiftlint swiftformat
          echo "$RUNNER_TEMP/lint-tools" >> "$GITHUB_PATH"
          ./swiftlint version
          ./swiftformat --version

      # Simulator test builds never need a signing identity; test.sh turns signing off when CI is set.
      - run: make lint

      - run: make test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .build/test-logs/*.log
            .build/test-logs/*.xcresult
